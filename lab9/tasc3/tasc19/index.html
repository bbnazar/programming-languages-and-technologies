<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch API: поиск с debounce</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Поиск публикаций</h1>

  <label for="search">Введите слово (например: qui, est, sunt)</label>
  <input id="search" type="search" placeholder="Поиск..." autocomplete="off">

  <div class="controls">
    <button id="retry" hidden>Повторить</button>
  </div>

  <p id="status" role="status"></p>
  <p id="stats"></p>
  <ul id="results"></ul>
</body>
</html>

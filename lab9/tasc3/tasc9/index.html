<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch API: фильтр задач</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Задачи с фильтром</h1>

  <div class="controls">
    <button id="load">Загрузить</button>
    <button id="retry" hidden>Повторить</button>
  </div>

  <div class="filters" role="group" aria-label="Фильтр задач">
    <button class="filter active" data-filter="all" disabled>Все</button>
    <button class="filter" data-filter="done" disabled>Выполненные</button>
    <button class="filter" data-filter="active" disabled>Невыполненные</button>
  </div>

  <p id="status" role="status"></p>
  <p id="stats"></p>
  <ul id="results"></ul>
</body>
</html>

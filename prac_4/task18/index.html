<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование мероприятия</title>
    <link rel="stylesheet" href="C:\Users\Student\Desktop\programming-languages-and-technologies\prac_4\task18\style.css">
</head>
<body>

<div class="container">

    <h1>Бронирование мероприятия</h1>

    <form id="bookingForm">

        <div class="form-group">
            <label for="fullName">ФИО:</label>
            <input
                type="text"
                id="fullName"
                placeholder="Введите ФИО"
            >
            <span class="error" id="nameError"></span>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                placeholder="example@mail.com"
            >
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="ticket">Категория билета:</label>

            <select id="ticket">
                <option value="">Выберите категорию</option>
                <option value="5000">Стандарт — 5 000 ₸</option>
                <option value="9000">VIP — 9 000 ₸</option>
                <option value="15000">Premium — 15 000 ₸</option>
            </select>

            <span class="error" id="ticketError"></span>
        </div>

        <div class="form-group">
            <label for="quantity">Количество билетов:</label>

            <input
                type="number"
                id="quantity"
                min="1"
                max="10"
                value="1"
            >

            <span class="error" id="quantityError"></span>
        </div>

        <div class="form-group">
            <label>Дополнительные опции:</label>

            <label class="checkbox-label">
                <input
                    type="checkbox"
                    name="option"
                    value="2000"
                >
                Фото с мероприятия — 2 000 ₸
            </label>

            <label class="checkbox-label">
                <input
                    type="checkbox"
                    name="option"
                    value="3000"
                >
                Памятный подарок — 3 000 ₸
            </label>

            <label class="checkbox-label">
                <input
                    type="checkbox"
                    name="option"
                    value="5000"
                >
                Доступ в VIP-зону — 5 000 ₸
            </label>
        </div>

        <button type="submit">
            Забронировать
        </button>

    </form>

    <div id="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>

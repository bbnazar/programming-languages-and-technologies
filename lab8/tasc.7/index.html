<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 7: Выбор языка</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <label for="lang-select" id="label-select">Выберите язык:</label>
            <select id="lang-select">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="kk">Қазақша</option>
            </select>
        </header>
        
        <main class="content-box">
            <h1 id="content-title">Добро пожаловать!</h1>
            <p id="content-text">Это демонстрационное приложение, которое запоминает ваш выбор языка интерфейса с помощью LocalStorage.</p>
        </main>
    </div>
</body>
</html>

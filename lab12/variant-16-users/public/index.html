<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление пользователями</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Управление пользователями</h1>
    <p id="status" class="status"></p>

    <!-- Форма входа -->
    <form id="loginForm" class="card">
      <input id="username" placeholder="Логин" autocomplete="username">
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>

    <!-- Приватный раздел (виден только после входа) -->
    <section id="private" hidden>
      <div class="card">
        <p>Вы: <b id="who"></b> (роль: <b id="role"></b>)
          <button id="logout" type="button">Выйти</button></p>
        <p id="timer" class="timer"></p>
        <button id="tryAdmin" type="button">Попробовать открыть журнал</button>
      </div>

      <!-- Панель администратора. Показывается только admin, но доступ всё равно проверяет сервер -->
      <div id="adminPanel" class="card" hidden>
        <h3>Пользователи</h3>
        <table id="usersTable"></table>

        <form id="userForm" class="inline-form">
          <input id="newUsername" placeholder="Логин">
          <input id="newName" placeholder="Имя">
          <input id="newPassword" type="password" placeholder="Пароль (мин. 6)">
          <select id="newRole">
            <option value="user">user</option>
            <option value="admin">admin</option>
          </select>
          <button type="submit">Создать</button>
        </form>

        <h3>Журнал входа/выхода</h3>
        <table id="logsTable"></table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
